version: '3'

tasks:
  perf:
    cmds:
      - bash scripts/perf.sh

  run:mac:
    cmds:
      - go run -tags private_mac_apis .

  build:mac:
    deps: [frontend]
    cmds:
      - go build -tags production,private_mac_apis -trimpath -o build/bin/Mythra .

  frontend:
    dir: frontend
    cmds:
      - npm ci
      - npm run build

  build:windows:
    deps: [frontend]
    cmds:
      - task: build:windows:binary

  build:windows:binary:
    cmds:
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
      - go build -tags production -trimpath -ldflags="-H windowsgui" -o build/bin/Mythra.exe .

  check:
    cmds:
      - go test ./internal/... ./cmd/... .
      - go vet ./internal/... ./cmd/... .
      - cd frontend && npm run lint && npm test && npm run build
