version: '3'

tasks:
  run:mac:
    cmds:
      - go run -tags private_mac_apis .

  build:mac:
    deps: [frontend]
    cmds:
      - go build -tags production,private_mac_apis -trimpath -o build/bin/cryptotape .

  frontend:
    dir: frontend
    cmds:
      - npm ci
      - npm run build

  build:windows:
    deps: [frontend]
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/cryptotape.exe .

  check:
    cmds:
      - go test ./internal/... .
      - go vet ./internal/... .
      - cd frontend && npm run lint && npm test && npm run build
