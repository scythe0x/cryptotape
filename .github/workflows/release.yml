name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: validate version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'expected vMAJOR.MINOR.PATCH tag' }
          $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version -or $info.fixed.file_version -ne $version -or
              $info.info.'0000'.ProductVersion -ne $version) {
            throw 'tag and application versions must match'
          }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test -count=1 ./internal/... ./cmd/... .
      - run: go vet ./internal/... ./cmd/... .
      - name: install build tools
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33
      - run: wails3 task build:windows:binary
      - name: retain private build metadata
        uses: actions/upload-artifact@v4
        with:
          name: private-windows-build-metadata
          path: build/private/
          retention-days: 14
          if-no-files-found: error
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME build/bin/Mythra.exe --repo $env:GITHUB_REPOSITORY --verify-tag --title "Mythra $env:GITHUB_REF_NAME" --generate-notes

  download-link:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mythra-download-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: download published executable
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Mythra.exe --dir release
      - name: update public download
        env:
          DEPLOY_KEY: ${{ secrets.MYTHRA_RELEASE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MYTHRA_RELEASE_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "a newer release is already published; keeping its download"
            exit 0
          fi
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$directory/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$directory/known_hosts"
          chmod 600 "$directory/key"
          ssh -T -i "$directory/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$directory/known_hosts" \
            mythra-release@212.113.104.39 < release/Mythra.exe
          curl --fail --silent --show-error --retry 3 \
            https://scalping.mythra.pw/download --output "$directory/download.exe"
          cmp release/Mythra.exe "$directory/download.exe"
