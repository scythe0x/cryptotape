name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: validate version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'expected vMAJOR.MINOR.PATCH tag' }
          $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
          $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version -or $info.fixed.file_version -ne $version -or
              $info.info.'0000'.ProductVersion -ne $version) {
            throw 'tag and application versions must match'
          }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test -count=1 ./internal/... ./cmd/... .
      - run: go vet ./internal/... ./cmd/... .
      - name: install build tools
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33
      - run: wails3 task build:windows:binary
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME build/bin/cryptotape.exe --repo $env:GITHUB_REPOSITORY --verify-tag --title "cryptotape $env:GITHUB_REF_NAME" --generate-notes
